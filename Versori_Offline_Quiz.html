<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#641d35"><title>Versori Vibe Check</title>
<style>
:root{color-scheme:light;--wine:#731f38;--dark:#24151b;--rose:#f9f1f3;--line:#e8dce0;--muted:#776871;--gold:#b58a50}*{box-sizing:border-box}body{margin:0;background:#faf6f7;color:var(--dark);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:570px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 25px #210c1514;padding-bottom:30px}.hero{background:linear-gradient(145deg,#5e1930,#8b3b55);color:white;padding:24px 20px 22px;border-radius:0 0 24px 24px}.brand{font-family:Georgia,serif;letter-spacing:5px;font-size:26px;text-align:center}.star{color:#e8c593}.hero h1{font-family:Georgia,serif;text-align:center;font-size:25px;margin:10px 0 5px}.hero p{text-align:center;color:#f3dce4;margin:0;font-size:13px}.tabs{display:flex;background:#f6edf0;padding:5px;border-radius:13px;margin:18px 17px 10px;gap:5px}.tabs button{flex:1;border:0;background:transparent;color:#755967;border-radius:9px;padding:11px 5px;font-weight:700}.tabs button.active{background:#fff;color:var(--wine);box-shadow:0 2px 7px #0000000c}.content{padding:7px 17px 20px}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#f6eaf0;color:#812b4a;font-weight:700;font-size:12px}.btn{border:0;border-radius:12px;background:var(--wine);color:white;padding:13px 16px;font-weight:750}.btn.secondary{background:#f6ecf0;color:#75233e}.btn.ghost{background:#fff;border:1px solid #ddd0d5;color:#612b40}.btn.danger{background:#fff0f0;color:#a22b37}.btn:disabled{opacity:.45;cursor:default}.full{width:100%}.card{border:1px solid var(--line);border-radius:17px;padding:16px;margin:13px 0;background:#fff}.shade{background:#faf5f7}.progress{height:7px;background:#ecdee4;border-radius:8px;overflow:hidden;margin:13px 0 22px}.progress div{height:100%;background:var(--wine);transition:width .25s}.question{font-family:Georgia,serif;font-size:26px;line-height:1.25;margin:13px 0 22px}.option{width:100%;display:flex;text-align:left;align-items:center;gap:13px;padding:17px 15px;border:2px solid #e9dfe3;border-radius:14px;background:#fff;color:#30202a;margin:11px 0;font-weight:650}.option.selected{border-color:#8d3452;background:#fbf0f4}.letter{flex:0 0 32px;height:32px;border:1px solid #dec9d0;border-radius:9px;display:grid;place-items:center;color:var(--wine)}.step{color:var(--wine);font-size:12px;font-weight:800;letter-spacing:1px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.spacer{flex:1}h2{font-family:Georgia,serif;font-size:22px;margin:9px 0 8px}h3{font-size:16px;margin:0 0 5px}.result{text-align:center;border:2px solid #caa0af;background:linear-gradient(#fff,#fdf5f7);border-radius:22px;padding:25px 15px;margin:16px 0}.result .type{font-family:Georgia,serif;font-size:37px;color:var(--wine);font-weight:bold;letter-spacing:1px}.result .seal{margin:15px auto;display:grid;place-items:center;border:2px solid #b8905c;width:96px;height:96px;border-radius:50%;font-size:34px;color:#aa803f}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.scores>div{text-align:center;padding:13px 4px;border:1px solid var(--line);border-radius:12px}.scores b{font-size:24px;display:block}.field{display:block;font-size:12px;font-weight:750;color:#57424b;margin:13px 0 5px}input[type=text],select{width:100%;border-radius:10px;padding:11px;border:1px solid #d5c5cb;background:white;color:#272027}input[type=checkbox]{accent-color:#7a2844;width:19px;height:19px;vertical-align:middle}.qitem{padding:13px;border:1px solid var(--line);border-radius:13px;margin:9px 0}.qhead{display:flex;align-items:center;gap:9px}.qhead strong{flex:1}.tag{font-size:11px;padding:4px 7px;border-radius:5px;font-weight:800;background:#f1e6ea}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.divider{border-top:1px solid var(--line);margin:18px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls .btn{padding:10px 12px;font-size:13px}.group{font-size:12px;color:#876574;margin:3px 0}.help{padding:12px;background:#fff7e9;border-left:3px solid #c99e56;border-radius:8px;font-size:12px;color:#74583a}.hide{display:none!important}.saveNote{color:#406850;font-size:12px}.footer{font-size:12px;text-align:center;color:#8f7982;margin:20px 0}button:focus-visible,input:focus-visible{outline:3px solid #c3a3a9}
</style></head>
<body><main class="shell"><header class="hero"><div class="brand">VERSORI<span class="star">✦</span></div><h1>Vibe Check</h1><p>Six impossible choices. One official personality.</p></header><nav class="tabs"><button id="tabPlay" class="active" onclick="switchTab('play')">Play</button><button id="tabManage" onclick="switchTab('manage')">Questions</button><button id="tabGuide" onclick="switchTab('guide')">Help</button></nav><section id="play" class="content"></section><section id="manage" class="content hide"></section><section id="guide" class="content hide"></section></main>
<script>
'use strict';
const TYPES={B:'Baddie',D:'Diva',S:'Sweetheart'};
const INITIAL=[
{id:'q1',g:1,a:'Never date again',b:'Never travel again',x:'B',y:'S',active:true},
{id:'q2',g:2,a:'Never eat pani puri',b:'Never attend Garba',x:'D',y:'S',active:true},
{id:'q3',g:3,a:'Never use Instagram',b:'Never take selfies',x:'B',y:'D',active:true},
{id:'q4',g:4,a:'Never fall in love',b:'Never make new friends',x:'S',y:'D',active:true},
{id:'q5',g:5,a:'Never buy new clothes',b:'Never wear jewellery',x:'D',y:'B',active:true},
{id:'q6',g:6,a:'Never have girls’ nights',b:'Never have date nights',x:'S',y:'B',active:true},
{id:'q7',g:2,a:'Never listen to music',b:'Never dance again',x:'D',y:'S',active:false},
{id:'q8',g:6,a:'Never lie again',b:'Never detect lies',x:'S',y:'B',active:false},
{id:'q9',g:1,a:'Never know your admirers',b:'Never hide your crush',x:'B',y:'S',active:false},
{id:'q10',g:4,a:'Never flirt again',b:'Never recognise flirting',x:'S',y:'D',active:false},
{id:'q11',g:5,a:'Never attend weddings',b:'Never attend concerts',x:'D',y:'B',active:false},
{id:'q12',g:3,a:'Never delete messages',b:'Never delete search history',x:'B',y:'D',active:false}
];
let questions=load('versori_vibe_questions_v1',INITIAL),game=null,editing=null;
function load(k,f){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)&&v.length?v:f.map(q=>({...q}))}catch(e){return f.map(q=>({...q}))}}
function persist(){try{localStorage.setItem('versori_vibe_questions_v1',JSON.stringify(questions))}catch(e){alert('Could not save settings on this browser.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function switchTab(t){['play','manage','guide'].forEach(n=>{document.getElementById(n).classList.toggle('hide',n!==t);document.getElementById('tab'+n[0].toUpperCase()+n.slice(1)).classList.toggle('active',n===t)});if(t==='play')renderPlay();if(t==='manage')renderManage();if(t==='guide')renderGuide()}
function makeRound(){let list=questions.filter(q=>q.active);if(!list.length){alert('Select some questions in the Questions tab first.');switchTab('manage');return}game={ids:list.map(x=>x.id),pos:0,answers:{},tie1:null,tie2:null,done:false};renderPlay()}
function counts(){let c={B:0,D:0,S:0};if(game)game.ids.forEach(id=>{let a=game.answers[id],q=questions.find(z=>z.id===id);if(a&&q)c[a==='A'?q.x:q.y]++});return c}
function chosenCount(){return game?game.ids.filter(id=>game.answers[id]).length:0}
function selectAns(a){game.answers[game.ids[game.pos]]=a;renderPlay()}
function prev(){game.pos=Math.max(0,game.pos-1);game.done=false;game.tie1=null;game.tie2=null;renderPlay()}
function next(){if(!game.answers[game.ids[game.pos]])return;if(game.pos<game.ids.length-1)game.pos++;else game.done=true;renderPlay()}
function newRound(){game=null;renderPlay()}
function resultSentence(t){return t==='B'?'Too iconic to give a damn.':t==='D'?'The spotlight was made for you.':'The world needs more hearts like yours.'}
function finalOutcome(){let c=counts(),max=Math.max(...Object.values(c)),tied=Object.keys(c).filter(k=>c[k]===max);if(tied.length===1)return {winner:tied[0]};if(tied.length===2){let k=tied.slice().sort().join('');let w=game.tie1;if(!w)return {tie:k,kind:2};return {winner:w}}
if(!game.tie1)return {tie:'ALL',kind:3};return {winner:game.tie1}}
const TIES={BD:{title:'Baddie vs Diva',a:'Never lose an argument',b:'Never have a bad outfit',x:'B',y:'D'},BS:{title:'Baddie vs Sweetheart',a:'Never give second chances',b:'Never give up on love',x:'B',y:'S'},DS:{title:'Diva vs Sweetheart',a:'Never go unnoticed',b:'Never go unloved',x:'D',y:'S'}};
function tieAnswer(type){game.tie1=type;renderPlay()}
function renderPlay(){let box=document.getElementById('play');if(!game){let active=questions.filter(q=>q.active);box.innerHTML=`<div class="topline"><h2>Ready to certify?</h2><span class="pill">${active.length} questions selected</span></div><p class="muted small">Ask one question at a time, tap her answer, and the app calculates the personality automatically.</p><div class="card shade"><div style="font-size:29px;margin-bottom:8px">🖤 &nbsp;💋 &nbsp;🎀</div><strong>Baddie · Diva · Sweetheart</strong><p class="muted small">No tally marks. No internet. No account needed.</p></div><button class="btn full" onclick="makeRound()">Start new vibe check →</button><p class="muted small">Change the questions any time in <b>Questions</b>. Your selections are saved on this device.</p>`;return}
if(!game.done){let id=game.ids[game.pos],q=questions.find(q=>q.id===id);if(!q){game=null;return renderPlay()}let a=game.answers[id];box.innerHTML=`<div class="topline"><span class="step">QUESTION ${game.pos+1} OF ${game.ids.length}</span><span class="pill">${chosenCount()} answered</span></div><div class="progress"><div style="width:${100*chosenCount()/game.ids.length}%"></div></div><div class="question">Would you rather…</div><button class="option ${a==='A'?'selected':''}" onclick="selectAns('A')"><span class="letter">A</span><span>${esc(q.a)}</span></button><button class="option ${a==='B'?'selected':''}" onclick="selectAns('B')"><span class="letter">B</span><span>${esc(q.b)}</span></button><div class="row" style="margin-top:26px"><button class="btn secondary" onclick="prev()" ${game.pos===0?'disabled':''}>← Back</button><div class="spacer"></div><button class="btn" onclick="next()" ${!a?'disabled':''}>${game.pos===game.ids.length-1?'Reveal result ✨':'Next →'}</button></div><p class="muted tiny" style="text-align:center;margin-top:22px">Scores stay hidden until the reveal.</p>`;return}
let outcome=finalOutcome(),c=counts();let body=`<div class="scores"><div><b>${c.B}</b><span class="tiny">🖤 Baddie</span></div><div><b>${c.D}</b><span class="tiny">💋 Diva</span></div><div><b>${c.S}</b><span class="tiny">🎀 Sweetheart</span></div></div>`;
if(outcome.winner){let w=outcome.winner;body+=`<div class="result"><div class="step">OFFICIALLY CERTIFIED BY VERSORI</div><div class="seal">✦</div><div class="type">${TYPES[w].toUpperCase()}</div><p>${resultSentence(w)}</p></div><button class="btn full" onclick="newRound()">Next participant →</button>`}else if(outcome.kind===3){body+=`<div class="card shade"><span class="pill">2–2–2 FINAL ROUND</span><h2>The ultimate vibe check</h2><p>Which compliment would you secretly love hearing?</p>${[['B','“Nobody can mess with her.”'],['D','“She’s the main character.”'],['S','“Anyone would be lucky to have her.”']].map(([k,v])=>`<button class="option" onclick="tieAnswer('${k}')">${v}</button>`).join('')}</div>`}else{let t=TIES[outcome.tie];body+=`<div class="card shade"><span class="pill">TIEBREAKER</span><h2>${t.title}</h2><p>Would you rather…</p><button class="option" onclick="tieAnswer('${t.x}')"><span class="letter">A</span>${t.a}</button><button class="option" onclick="tieAnswer('${t.y}')"><span class="letter">B</span>${t.b}</button></div>`}
box.innerHTML=`<div class="topline"><h2>Results</h2><span class="pill">${game.ids.length} answers</span></div>${body}<div class="divider"></div><div class="row"><button class="btn ghost" onclick="game.done=false;game.tie1=null;renderPlay()">← Edit last answer</button><div class="spacer"></div><button class="btn danger" onclick="if(confirm('Discard this round and start again?'))newRound()">Reset</button></div>`}
function setActive(id,yes){questions=questions.map(q=>q.id===id?{...q,active:yes}:q);persist();renderManage()}
function usePreset(n){questions=questions.map(q=>({...q,active:n==='main'?/^q[1-6]$/.test(q.id):n==='alternate'?/^q(7|8|9|10|11|12)$/.test(q.id):q.active}));persist();renderManage()}
function randomPairs(){let ids=[];for(let g=1;g<=6;g++){let list=questions.filter(q=>q.g===g);if(list.length)ids.push(list[Math.floor(Math.random()*list.length)].id)}questions=questions.map(q=>({...q,active:ids.includes(q.id)}));persist();renderManage()}
function editQuestion(id){editing=id;renderManage();document.getElementById('editor')?.scrollIntoView({behavior:'smooth',block:'start'})}
function saveEdit(){let form=document.getElementById('editform');let a=form.elements.a.value.trim(),b=form.elements.b.value.trim();if(!a||!b){alert('Both answers are required.');return}let g=Number(form.elements.g.value),x=form.elements.x.value,y=form.elements.y.value;if(x===y){alert('Choose different personality results for A and B.');return}if(editing==='new'){let id='custom'+Date.now();questions.push({id,g,a,b,x,y,active:true})}else{questions=questions.map(q=>q.id===editing?{...q,g,a,b,x,y}:q)}editing=null;persist();renderManage()}
function deleteEdit(){if(!confirm('Remove this question permanently?'))return;questions=questions.filter(q=>q.id!==editing);editing=null;persist();renderManage()}
function resetBank(){if(!confirm('Restore the original 12 questions? This removes your changes.'))return;questions=INITIAL.map(q=>({...q}));editing=null;game=null;persist();renderManage()}
function renderManage(){let e=questions.find(q=>q.id===editing),active=questions.filter(q=>q.active).length;let box=document.getElementById('manage');box.innerHTML=`<div class="topline"><h2>Question bank</h2><span class="pill">${active} in current round</span></div><p class="muted small">Tick any questions you want to ask. Unticked questions stay saved for later. Tap Edit to change wording and scoring.</p><div class="controls"><button class="btn secondary" onclick="usePreset('main')">Main 6</button><button class="btn secondary" onclick="usePreset('alternate')">Alternate 6</button><button class="btn secondary" onclick="randomPairs()">Mix 6 🎲</button><button class="btn ghost" onclick="editQuestion('new')">+ Add</button></div><div class="help" style="margin-top:13px">For balanced rounds, use Main 6, Alternate 6, or Mix 6. Manually selecting questions also works, but may not give every title equal chances.</div>${questions.map((q,i)=>`<div class="qitem"><div class="qhead"><input type="checkbox" aria-label="Include question ${i+1}" ${q.active?'checked':''} onchange="setActive('${q.id}',this.checked)"><strong>${esc(q.a)} <span class="muted">or</span> ${esc(q.b)}</strong><button class="btn ghost" style="padding:7px 9px" onclick="editQuestion('${q.id}')">Edit</button></div><div class="group">Pair ${q.g} &nbsp;·&nbsp; A: ${TYPES[q.x]} &nbsp;·&nbsp; B: ${TYPES[q.y]}</div></div>`).join('')}<div id="editor"></div><button class="btn danger full" style="margin-top:18px" onclick="resetBank()">Restore original questions</button>`;
if(editing){let q=e||{a:'',b:'',g:1,x:'B',y:'D'};document.getElementById('editor').innerHTML=`<div class="card shade"><div class="topline"><h2>${editing==='new'?'Add question':'Edit question'}</h2><button class="btn ghost" onclick="editing=null;renderManage()">✕</button></div><form id="editform" onsubmit="event.preventDefault();saveEdit()"><label class="field" for="qa">Option A</label><input id="qa" name="a" type="text" maxlength="125" value="${esc(q.a)}" required><label class="field" for="qb">Option B</label><input id="qb" name="b" type="text" maxlength="125" value="${esc(q.b)}" required><div class="grid2"><div><label class="field">A gives point to</label><select name="x">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${q.x===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="field">B gives point to</label><select name="y">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${q.y===k?'selected':''}>${v}</option>`).join('')}</select></div></div><label class="field">Rotation pair</label><select name="g">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${q.g===n?'selected':''}>Pair ${n}</option>`).join('')}</select><p class="muted tiny">Mix 6 picks one random question from each pair.</p><div class="controls" style="margin-top:16px"><button class="btn" type="submit">Save question</button>${editing!=='new'?'<button class="btn danger" type="button" onclick="deleteEdit()">Delete</button>':''}</div></form></div>`}
}
function renderGuide(){document.getElementById('guide').innerHTML=`<h2>How to use it</h2><div class="card"><h3>1. Choose questions</h3><p class="small muted">Go to Questions. Select Main 6, Alternate 6, Mix 6, or tick your own. You can add, edit or remove questions anytime.</p><h3>2. Run the game</h3><p class="small muted">Press Start. Ask each question and tap A or B as she answers. The next question appears automatically when you press Next.</p><h3>3. Reveal & award</h3><p class="small muted">The app totals Baddie, Diva and Sweetheart scores. If there's a tie, the correct tiebreaker appears. Handwrite the winner's name on her Versori certificate.</p><h3>4. Next girl</h3><p class="small muted">Press Next participant. Question settings remain saved.</p></div><div class="card shade"><h3>Offline and private</h3><p class="small muted">This app has no login, tracking, ads or required internet connection. Changes are saved locally on this phone. No participant names or answers are sent anywhere.</p></div><div class="help">If you open the HTML file directly in a browser, local saving depends on your browser's file-storage policy. The Android APK built from the included Android Studio project saves settings locally in its own app storage.</div><p class="footer">VERSORI · CERTIFIED TO SPARKLE ✦</p>`}
renderPlay();
</script></body></html>
